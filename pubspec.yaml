name: vorxy_code_editor
description: Vorxy Code Editor - Mobile code editor
publish_to: none
version: 3.7.7+377

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  re_editor: ^1.2.1
  re_highlight: ^0.0.3
  path_provider: ^2.1.5
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.1
  file_picker: ^10.3.10
  permission_handler: ^11.3.1
  share_plus: ^10.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "Vorxy Code Editor_icon.png"
  min_sdk_android: 21
