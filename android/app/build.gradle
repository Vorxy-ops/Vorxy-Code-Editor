        jniLibs {
            useLegacyPackaging = true
        }
    }

    signingConfigs {
        release {
            storeFile file("vorxy-code-editor.jks")
            storePassword "hvf8Ozq2t8X5Id03y"
            keyAlias "vorxy code editor"
            keyPassword "hvf8Ozq2t8X5Id03y"
        }
